name: Username Validation Tests

# Automated test flow: runs on every push and pull request, and can be
# triggered manually from the Actions tab.
on:
  push:
    branches: ["**"]
    paths:
      - "username_validation/**"
      - ".github/workflows/username-validation-tests.yml"
  pull_request:
    paths:
      - "username_validation/**"
      - ".github/workflows/username-validation-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run username validation tests
        run: python -m unittest discover -s username_validation/tests -v
